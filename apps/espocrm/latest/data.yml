additionalProperties:
    formFields:
        - default: "8080"
          edit: true
          envKey: PANEL_APP_PORT_HTTP
          labelEn: Service Port 8080
          labelZh: 服务端口 8080
          required: true
          rule: paramPort
          type: number
        - child:
            default: ""
            envKey: PANEL_DB_HOST
            required: true
            type: service
          default: mariadb
          envKey: PANEL_DB_TYPE
          labelEn: Database Type
          labelZh: 数据库类型
          required: true
          type: apps
          values:
            - label: MySQL
              value: mysql
            - label: MariaDB
              value: mariadb
        - default: espocrm
          edit: true
          envKey: PANEL_DB_NAME
          labelEn: Database Name
          labelZh: 数据库名称
          required: true
          rule: paramCommon
          type: text
        - default: espocrm
          edit: true
          envKey: PANEL_DB_USER
          labelEn: Database User
          labelZh: 数据库用户
          required: true
          rule: paramCommon
          type: text
        - default: ""
          edit: true
          envKey: PANEL_DB_USER_PASSWORD
          labelEn: Database Password
          labelZh: 数据库密码
          required: true
          rule: paramComplexity
          type: password
        - default: admin
          edit: true
          envKey: ESPOCRM_ADMIN_USERNAME
          labelEn: Admin Username
          labelZh: 管理员用户名
          required: true
          rule: paramCommon
          type: text
        - default: ""
          edit: true
          envKey: ESPOCRM_ADMIN_PASSWORD
          labelEn: Admin Password
          labelZh: 管理员密码
          required: true
          rule: paramComplexity
          type: password
        - default: ""
          edit: true
          envKey: ESPOCRM_SITE_URL
          labelEn: Site URL
          labelZh: 站点访问地址
          required: true
          rule: paramExtUrl
          type: text
