services:
  grafana:
    image: "grafana/grafana:13.1.3"
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./data:/var/lib/grafana
    ports:
      - ${PANEL_APP_PORT_HTTP}:3000
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
