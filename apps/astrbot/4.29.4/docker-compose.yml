services:
  astrbot:
    image: soulter/astrbot:v4.29.4
    container_name: ${CONTAINER_NAME}
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PANEL_APP_PORT_HTTP}:6185"
      - "${PANEL_APP_PORT_API}:6199"
    environment:
      TZ: ${TZ}
      ASTRBOT_DASHBOARD_INITIAL_PASSWORD: ${ASTRBOT_DASHBOARD_INITIAL_PASSWORD}
    volumes:
      - ./data:/AstrBot/data
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
