title: Kokoro-FastAPI - OpenAI 兼容的本地语音合成服务
description: 把 Kokoro-82M 语音模型封装成 OpenAI 兼容的 TTS 接口，自带网页播放器，支持流式输出、多语言音色与 ElevenLabs/Cartesia 兼容协议。
