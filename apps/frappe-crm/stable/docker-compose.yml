services:
  mariadb:
    image: mariadb:10.8
    container_name: ${CONTAINER_NAME}-Db
    restart: always
    volumes:
      - ./db-data:/var/lib/mysql
    networks:
      - 1panel-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 10s
      retries: 5
    labels:
      createdBy: Apps
  redis:
    image: redis:alpine
    container_name: ${CONTAINER_NAME}-Redis
    restart: always
    volumes:
      - ./redis-data:/data
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
  configurator:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}-Configurator
    restart: on-failure
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    environment:
      - DB_HOST=${CONTAINER_NAME}-Db
      - DB_PORT=3306
      - REDIS_CACHE=${CONTAINER_NAME}-Redis:6379
      - REDIS_QUEUE=${CONTAINER_NAME}-Redis:6379
      - SOCKETIO_PORT=9000
    labels:
      createdBy: Apps
  create-site:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}-CreateSite
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        test -d sites/$$FRAPPE_SITE_NAME ||
        bench new-site $$FRAPPE_SITE_NAME
        --mariadb-root-password $$DB_PASSWORD
        --admin-password $$FRAPPE_ADMIN_PASSWORD
        --install-app crm
        --no-enqueue
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    environment:
      - FRAPPE_SITE_NAME=${FRAPPE_SITE_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - FRAPPE_ADMIN_PASSWORD=${FRAPPE_ADMIN_PASSWORD}
    depends_on:
      configurator:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    labels:
      createdBy: Apps
  backend:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}-Backend
    restart: always
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    environment:
      - GUNICORN_THREADS=4
      - GUNICORN_WORKERS=2
      - GUNICORN_TIMEOUT=120
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    labels:
      createdBy: Apps
  frontend:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}
    restart: always
    command:
      - nginx-entrypoint.sh
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    environment:
      - BACKEND=${CONTAINER_NAME}-Backend:8000
      - SOCKETIO=${CONTAINER_NAME}-Websocket:9000
      - FRAPPE_SITE_NAME_HEADER=$$host
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - PROXY_READ_TIMEOUT=120
      - CLIENT_MAX_BODY_SIZE=50m
    depends_on:
      - backend
      - websocket
    labels:
      createdBy: Apps
  websocket:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}-Websocket
    restart: always
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    labels:
      createdBy: Apps
  queue-short:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}-QueueShort
    restart: always
    command: bench worker --queue short,default
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    labels:
      createdBy: Apps
  queue-long:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}-QueueLong
    restart: always
    command: bench worker --queue long,default,short
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    labels:
      createdBy: Apps
  scheduler:
    image: ghcr.io/frappe/crm:stable
    container_name: ${CONTAINER_NAME}-Scheduler
    restart: always
    command: bench schedule
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    networks:
      - 1panel-network
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
