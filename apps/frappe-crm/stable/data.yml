additionalProperties:
    formFields:
        - default: "8080"
          edit: true
          envKey: PANEL_APP_PORT_HTTP
          labelEn: Service Port 8080
          labelZh: 服务端口 8080
          required: true
          rule: paramPort
          type: number
        - default: ""
          edit: true
          envKey: PANEL_DB_HOST
          key: mariadb
          labelEn: Database Service
          labelZh: 数据库服务
          required: true
          type: service
        - default: frappe_crm
          envKey: PANEL_DB_NAME
          random: true
          required: true
          rule: paramCommon
          type: text
          labelEn: Database Name
          labelZh: 数据库名称
        - default: frappe_crm
          envKey: PANEL_DB_USER
          random: true
          required: true
          rule: paramCommon
          type: text
          labelEn: Database User
          labelZh: 数据库用户
        - default: frappecrm
          envKey: PANEL_DB_USER_PASSWORD
          random: true
          required: true
          rule: paramComplexity
          type: password
          labelEn: Database Password
          labelZh: 数据库密码
        - default: ""
          edit: true
          envKey: PANEL_DB_ROOT_PASSWORD
          labelEn: Database Root Password
          labelZh: 数据库 Root 密码
          required: true
          rule: paramComplexity
          type: password
        - default: ""
          edit: true
          envKey: PANEL_REDIS_HOST
          key: redis
          labelEn: Redis Service
          labelZh: Redis 服务
          required: true
          type: service
        - default: ""
          disabled: true
          envKey: PANEL_REDIS_ROOT_PASSWORD
          labelEn: Redis Password
          labelZh: Redis 密码
          required: true
          type: text
        - default: ""
          edit: true
          envKey: FRAPPE_SITE_NAME
          labelEn: Site Name
          labelZh: 站点域名
          required: true
          rule: paramCommon
          type: text
        - default: ""
          edit: true
          envKey: FRAPPE_ADMIN_PASSWORD
          labelEn: Administrator Password
          labelZh: 管理员密码
          required: true
          rule: paramComplexity
          type: password
