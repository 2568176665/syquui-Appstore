services:
  frappe-crm-permissions:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-permissions
    user: root
    entrypoint:
    - bash
    - -c
    command:
    - 'mkdir -p /mnt/sites /mnt/logs; chown -R "$$(id -u frappe):$$(id -g frappe)" /mnt/sites /mnt/logs;

      '
    restart: 'no'
    volumes:
    - ./data/sites:/mnt/sites
    - ./data/logs:/mnt/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-configurator:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-configurator
    entrypoint:
    - bash
    - -c
    command:
    - "set -e; mkdir -p sites; if [ ! -s sites/common_site_config.json ]; then\n  printf '%s\\n' '{}' > sites/common_site_config.json;\nfi; ls -1 apps > sites/apps.txt; REDIS_PASSWORD_ENCODED=$$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.getenv(\"REDIS_PASSWORD\", \"\"), safe=\"\"))'); REDIS_AUTH=\"\"; if [ -n \"$$REDIS_PASSWORD_ENCODED\" ]; then REDIS_AUTH=\":$$REDIS_PASSWORD_ENCODED@\"; fi; bench set-config -g db_host \"$$DB_HOST\"; bench set-config -gp db_port 3306; bench set-config -g redis_cache \"redis://$${REDIS_AUTH}$${REDIS_HOST}:6379/$${REDIS_CACHE_DB}\"; bench set-config -g redis_queue \"redis://$${REDIS_AUTH}$${REDIS_HOST}:6379/$${REDIS_QUEUE_DB}\"; bench set-config -g redis_socketio \"redis://$${REDIS_AUTH}$${REDIS_HOST}:6379/$${REDIS_QUEUE_DB}\"; bench set-config -gp socketio_port 9000; bench set-config -g chromium_path /usr/bin/chromium-headless-shell;\n"
    environment:
      DB_HOST: ${PANEL_DB_HOST}
      REDIS_HOST: ${PANEL_REDIS_HOST}
      REDIS_PASSWORD: ${PANEL_REDIS_ROOT_PASSWORD}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB}
      REDIS_QUEUE_DB: ${REDIS_QUEUE_DB}
    restart: 'no'
    depends_on:
      frappe-crm-permissions:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-create-site:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-create-site
    entrypoint:
    - bash
    - -c
    command:
    - "set -e\nwait-for-it -t 180 \"$$DB_HOST:$$DB_PORT\"\nwait-for-it -t 180 \"$$REDIS_HOST:6379\"\nif [ -f \"sites/$$FRAPPE_SITE_NAME/site_config.json\" ]; then\n  echo \"Site $$FRAPPE_SITE_NAME already exists; skipping site creation.\"\n  if ! bench --site \"$$FRAPPE_SITE_NAME\" list-apps | grep -qx crm; then\n    bench --site \"$$FRAPPE_SITE_NAME\" install-app crm\n  fi\nelse\n  echo \"Creating Frappe site: $$FRAPPE_SITE_NAME\"\n  echo \"Database host: $$DB_HOST:$$DB_PORT\"\n  echo \"Database name/user: $$DB_NAME\"\n  bench new-site \\\n    --db-name \"$$DB_NAME\" \\\n    --db-password \"$$DB_PASSWORD\" \\\n    --db-host \"$$DB_HOST\" \\\n    --db-port \"$$DB_PORT\" \\\n    --db-root-username root \\\n    --db-root-password \"$$DB_ROOT_PASSWORD\" \\\n    --mariadb-user-host-login-scope='%' \\\n    --admin-password \"$$ADMIN_PASSWORD\" \\\n    --install-app crm \\\n    --set-default \\\n    \"$$FRAPPE_SITE_NAME\"\nfi\nbench use \"$$FRAPPE_SITE_NAME\"\n"
    environment:
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_ROOT_PASSWORD: ${PANEL_DB_ROOT_PASSWORD}
      DB_HOST: ${PANEL_DB_HOST}
      REDIS_HOST: ${PANEL_REDIS_HOST}
      DB_NAME: ${FRAPPE_DB_NAME}
      DB_PASSWORD: ${FRAPPE_DB_PASSWORD}
      DB_PORT: ${PANEL_DB_PORT:-3306}
    restart: 'no'
    depends_on:
      frappe-crm-configurator:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-migrate:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-migrate
    entrypoint:
    - bash
    - -c
    command:
    - 'set -e; bench --site "$$FRAPPE_SITE_NAME" migrate; bench --site "$$FRAPPE_SITE_NAME" clear-cache;

      '
    environment:
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME}
    restart: 'no'
    depends_on:
      frappe-crm-create-site:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-backend:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-backend
    environment:
      GUNICORN_THREADS: '4'
      GUNICORN_WORKERS: '2'
      GUNICORN_TIMEOUT: '120'
    restart: unless-stopped
    depends_on:
      frappe-crm-migrate:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-websocket:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-websocket
    command:
    - node
    - /home/frappe/frappe-bench/apps/frappe/socketio.js
    restart: unless-stopped
    depends_on:
      frappe-crm-migrate:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-queue-short:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-queue-short
    command:
    - bench
    - worker
    - --queue
    - short,default
    restart: unless-stopped
    depends_on:
      frappe-crm-migrate:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-queue-long:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-queue-long
    command:
    - bench
    - worker
    - --queue
    - long,default,short
    restart: unless-stopped
    depends_on:
      frappe-crm-migrate:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm-scheduler:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}-scheduler
    command:
    - bench
    - schedule
    restart: unless-stopped
    depends_on:
      frappe-crm-migrate:
        condition: service_completed_successfully
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
  frappe-crm:
    image: ghcr.io/frappe/crm:v1.81.2
    container_name: ${CONTAINER_NAME}
    command:
    - nginx-entrypoint.sh
    environment:
      BACKEND: ${CONTAINER_NAME}-backend:8000
      SOCKETIO: ${CONTAINER_NAME}-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: '120'
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
    - ${PANEL_APP_PORT_HTTP}:8080
    restart: unless-stopped
    depends_on:
      frappe-crm-backend:
        condition: service_started
      frappe-crm-websocket:
        condition: service_started
    volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    networks:
    - 1panel-network
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
