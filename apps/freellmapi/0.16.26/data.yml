additionalProperties:
  formFields:
    - default: 3001
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelZh: Web 端口
      labelEn: Web Port
      required: true
      rule: paramPort
      type: number
    - default: admin@freellmapi.local
      edit: true
      envKey: PANEL_APP_ADMIN_EMAIL
      labelZh: 控制台管理员邮箱
      labelEn: Dashboard Admin Email
      required: true
      type: text
    - default: admin
      edit: true
      envKey: PANEL_APP_ADMIN_PASSWORD
      labelZh: 控制台管理员密码（至少 8 位，仅限字母数字与 .%@!~_-）
      labelEn: Dashboard Admin Password (min 8 chars, letters/digits and .%@!~_- only)
      required: true
      rule: paramComplexity
      type: password
      random: true
