services:
  mirofish:
    image: ghcr.io/666ghj/mirofish:v0.1.2
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - "${PANEL_APP_PORT_HTTP}:3000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      ZEP_API_KEY: ${ZEP_API_KEY}
    volumes:
      - ./data/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
